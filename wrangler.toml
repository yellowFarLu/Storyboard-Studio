name = "storyboard-studio"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./public"

# ===== LLM API 配置 =====
# LLM_API_KEY：通过 `wrangler pages secret put LLM_API_KEY` 设置，切勿写入代码或 Git。
# LLM_API_BASE：OpenAI 兼容接口地址。DeepSeek 默认；也可换 SiliconFlow 等。
# LLM_MODEL：模型名。
# 未设置 LLM_API_KEY 时，接口返回内置示例数据（mock 模式），便于本地开发与预览。
[vars]
LLM_API_BASE = "https://api.deepseek.com/v1"
LLM_MODEL = "deepseek-chat"

# ===== 跨会话云端记忆（Cloudflare KV，匿名设备 ID 维度，免费额度） =====
# 用途：任务快照与创作记忆云备份，跨会话/跨设备恢复（浏览器 localStorage 为本地主数据，KV 为云备份）
[[kv_namespaces]]
binding = "STORY_KV"
id = "fe71b4e2e07546058027daf237a115c3"
